name: CI (Push)

on:
  push:
    branches: [dev, main]

permissions: {}

jobs:
  codecov:
    name: Upload coverage to Codecov
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Extract PR number from commit message
        id: pr
        run: |
          PR_NUMBER=$(echo "$COMMIT_MESSAGE" | grep -oP '#\K\d+' || true)
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Get PR head SHA
        id: pr_sha
        if: steps.pr.outputs.number != ''
        run: |
          SHA=$(gh pr view ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --json headRefOid \
            --jq '.headRefOid')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find PR CI run ID
        id: run
        if: steps.pr_sha.outputs.sha != ''
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci-pr.yml/runs?head_sha=${{ steps.pr_sha.outputs.sha }}" \
            --jq "[.workflow_runs[] | {id, created_at}] | sort_by(.created_at) | reverse | first | .id")
          echo "id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Jacoco report from PR CI
        id: download
        if: steps.run.outputs.id != '' && steps.run.outputs.id != 'null'
        continue-on-error: true
        run: |
          gh run download ${{ steps.run.outputs.id }} \
            --name jacoco-report \
            --dir /tmp/jacoco-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Jacoco XML path
        id: report
        if: steps.download.outcome == 'success'
        run: |
          REPORT_FILE=$(find /tmp/jacoco-report -type f -name 'jacocoTestReport.xml' | head -n 1)
          echo "file=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Upload to Codecov
        if: steps.report.outputs.file != ''
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.file }}
          fail_ci_if_error: true

      - name: Skip (no PR artifact found)
        if: >-
          steps.pr.outputs.number == '' ||
          steps.pr_sha.outputs.sha == '' ||
          steps.run.outputs.id == '' ||
          steps.run.outputs.id == 'null' ||
          steps.download.outcome != 'success'
        run: echo "No PR artifact found — Codecov upload skipped"