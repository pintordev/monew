name: CI (Push)

on:
  push:
    branches: [dev, main]

permissions: {}

jobs:
  codecov:
    name: Upload coverage to Codecov
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Extract PR number from commit message
        id: pr
        run: |
          PR_NUMBER=$(git log -1 --pretty=%s | grep -oP '#\K\d+' || true)
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR CI run ID
        id: run
        if: steps.pr.outputs.number != ''
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci-pr.yml/runs" \
            --jq "[.workflow_runs[] | select((.pull_requests[].number | tostring) == \"${{ steps.pr.outputs.number }}\") | {id, created_at}] | sort_by(.created_at) | reverse | first | .id")
          echo "id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Jacoco report from PR CI
        if: steps.run.outputs.id != '' && steps.run.outputs.id != 'null'
        run: |
          gh run download ${{ steps.run.outputs.id }} \
            --name jacoco-report \
            --dir /tmp/jacoco-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Codecov
        if: steps.run.outputs.id != '' && steps.run.outputs.id != 'null'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /tmp/jacoco-report/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Skip (no PR artifact found)
        if: steps.pr.outputs.number == '' || steps.run.outputs.id == '' || steps.run.outputs.id == 'null'
        run: echo "No PR artifact found — Codecov upload skipped"