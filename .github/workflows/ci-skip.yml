name: CI

on:
  pull_request_target:
    branches: [dev, main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - '.coderabbit.yaml'

concurrency:
  group: ci-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: CI skipped
        run: echo "CI skipped — no code changes"
