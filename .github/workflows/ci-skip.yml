name: CI

on:
  pull_request_target:
    branches: [dev, main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - '.coderabbit.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: CI skipped
        run: echo "CI skipped — no code changes"
